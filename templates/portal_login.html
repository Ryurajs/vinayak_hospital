<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Vinayak Portal Login</title>
    <style>
      :root {
        --bg: #f4f1ff;
        --panel: #ffffff;
        --primary: #4d2adf;
        --primary-dark: #3017a4;
        --secondary: #141E5C;
        --secondary-dark: #0f173f;
        --text: #1d2433;
        --muted: #5e697d;
        --border: #e7e4fb;
        --danger: #c53030;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f4f1ff 0%, #eef4ff 100%);
        color: var(--text);
      }

      .login-box {
        width: min(430px, calc(100% - 32px));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(63, 42, 145, 0.12);
        padding: 32px 28px;
      }

      .brand {
        text-align: center;
        margin-bottom: 20px;
      }

      .brand-mark {
        display: inline-flex;
        width: 120px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: transparent;
        box-shadow: none;
        overflow: hidden;
      }

      .brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: 1.9rem;
        text-align: center;
        color: #141E5C;
      }

      .subtitle {
        text-align: center;
        margin: 0 0 26px;
        color: #141E5C;
        font-size: 0.95rem;
      }

      .error {
        background: rgba(197, 48, 48, 0.08);
        color: var(--danger);
        border: 1px solid rgba(197, 48, 48, 0.14);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 18px;
        font-size: 0.92rem;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
        color: var(--text);
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px 14px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: rgba(77, 42, 223, 0.5);
        box-shadow: 0 0 0 4px rgba(77, 42, 223, 0.08);
      }

      button {
        border: none;
        border-radius: 12px;
        background: #141E5C;
        color: #fff;
        font-weight: 700;
        padding: 14px 16px;
        cursor: pointer;
        font-size: 1rem;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        opacity: 0.98;
      }

      .meta {
        margin-top: 18px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="login-box">
      <div class="brand">
        <div class="brand-mark">
          <img src="{{ url_for('static', filename='logo.webp') }}" alt="Vinayak Hospital logo" />
        </div>
      </div>
      <h1>Portal Login</h1>
      <p class="subtitle">Vinayak Hospital Management Portal</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/portal/login">
        <label>
          Username
          <input type="text" name="username" placeholder="Enter username" required />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Enter password" required />
        </label>

        <button type="submit">Login</button>
      </form>

      <div class="meta">Use your portal credentials to access the dashboard.</div>
    </main>
  </body>
</html>
