<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Edit Department - Vinayak Portal</title>
    <style>
      :root { --secondary: #141E5C; --text: #1d2433; --muted: #5e697d; --border: #eae6f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: #f5f4ff; }
      .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--border); }
      .brand { color: var(--secondary); font-size: 0.82rem; font-weight: 800; letter-spacing: 0.04em; }
      .logout, .back-link { color: var(--text); text-decoration: none; font-size: 0.8rem; font-weight: 700; }
      .top-actions { display: flex; align-items: center; gap: 16px; }
      .logout { padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px; background: #f4f6fb; }
      main { width: min(760px, calc(100% - 40px)); margin: 34px auto; }
      .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 24px rgba(20, 30, 66, 0.04); }
      h1 { margin: 0 0 22px; color: var(--secondary); font-size: 1.5rem; }
      form { display: grid; gap: 16px; }
      label { display: grid; gap: 7px; color: var(--secondary); font-size: 0.76rem; font-weight: 700; }
      input, textarea { width: 100%; border: 1px solid rgba(20, 30, 92, 0.12); border-radius: 10px; padding: 10px 12px; color: var(--text); font: inherit; background: #fff; }
      textarea { min-height: 130px; resize: vertical; }
      .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
      .button { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
      .button.secondary { background: #eef0ff; color: var(--secondary); }
      .button.primary { background: var(--secondary); color: #fff; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">VINAYAK HOSPITAL &amp; MATERNITY HOME PORTAL</div>
      <div class="top-actions">
        <a class="back-link" href="{{ url_for('portal_add_departments') }}">Back to Departments</a>
        <a class="logout" href="/portal/logout">Logout</a>
      </div>
    </header>
    <main>
      <section class="card">
        <h1>Edit Department</h1>
        <form method="post" action="{{ url_for('portal_update_department', department_id=department.id) }}">
          <label for="department-name">
            Department Name
            <input id="department-name" name="name" type="text" value="{{ department.name }}" required />
          </label>
          <label for="department-description">
            Description
            <textarea id="department-description" name="description">{{ department.description or '' }}</textarea>
          </label>
          <div class="form-actions">
            <a class="button secondary" href="{{ url_for('portal_add_departments') }}">Cancel</a>
            <button class="button primary" type="submit">Save Changes</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
