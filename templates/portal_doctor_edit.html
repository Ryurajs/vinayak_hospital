<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Doctor</title>
    <style>
      :root {
        --bg: #f5f4ff;
        --panel: #ffffff;
        --primary: #4d2adf;
        --secondary: #141E5C;
        --text: #1d2433;
        --muted: #5e697d;
        --border: #eae6f9;
        --danger: #c53030;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .wrap {
        max-width: 540px;
        margin: 46px auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 12px 22px rgba(20, 30, 92, 0.08);
        padding: 20px 18px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 1.2rem;
        color: var(--secondary);
      }

      form {
        display: grid;
        gap: 12px;
      }

      .image-preview {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        background: #f8f8ff;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 0.74rem;
      }

      .image-preview img {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 50%;
        border: 1px solid rgba(20, 30, 92, 0.12);
        background: #fff;
      }

      .image-action {
        display: flex;
        justify-content: flex-start;
      }

      .mini-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(20, 30, 92, 0.12);
        background: #f4f6ff;
        color: var(--secondary);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--secondary);
      }

      input, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
        font-size: 0.8rem;
        color: var(--text);
        background: #fff;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }

      .btn {
        border: none;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--secondary);
        color: #fff;
      }

      .btn-secondary {
        background: #f4f6fb;
        color: var(--secondary);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Edit Doctor</h1>

      <form method="post" action="{{ url_for('portal_update_doctor', doctor_id=doctor.id) }}">
        <div class="image-preview">
          <img src="{{ doctor.image_url }}" alt="{{ doctor.name }}" />
          <span>Current doctor image</span>
        </div>

        <div class="image-action">
          <button type="button" class="mini-btn">Change Image</button>
        </div>

        <label>
          Name
          <input type="text" name="name" value="{{ doctor.name }}" required />
        </label>

        <label>
          Specialty
          <input type="text" name="specialty" value="{{ doctor.specialty }}" required />
        </label>

        <label>
          Department
          <select name="department">
            {% for department in departments %}
              <option value="{{ department }}" {% if doctor.specialty == department %}selected{% endif %}>{{ department }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          Bio
          <textarea name="bio" required>{{ doctor.bio or '' }}</textarea>
        </label>

        <div class="actions">
          <a href="{{ url_for('portal_add_doctors') }}" class="btn btn-secondary" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </body>
</html>
